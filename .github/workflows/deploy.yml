name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup target add wasm32-unknown-unknown
      - run: cargo clippy --target wasm32-unknown-unknown -- -D warnings
      - run: MIAQ_CMDS=cmds.json cargo test
      - id: cf
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          secrets: |
            PUBLIC_KEY
            DISCORD_TOKEN
        env:
          PUBLIC_KEY: ${{ vars.PUBLIC_KEY }}
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
      - name: register cmds
        run: |
          curl -sS --fail-with-body -X PUT "https://discord.com/api/v10/applications/$APP/commands" -H "Authorization: Bot $TOKEN" -H "Content-Type: application/json" --data-binary @cmds.json
        env:
          APP: ${{ vars.CLIENT_ID }}
          TOKEN: ${{ secrets.DISCORD_TOKEN }}
